# COT (Commitments of Traders) settings
cot_settings:
  data_sources:
    - "CFTC"
  
  categories:
    - name: "Commercial"
      description: "Hedgers and producers"
      
    - name: "Non-Commercial"
      description: "Large speculators and funds"
      
    - name: "Non-Reportable"
      description: "Small traders"
  
  instruments:
    - name: "Gold"
      cftc_code: "088691"
      
    - name: "Silver"
      cftc_code: "084691"
      
    - name: "Crude Oil"
      cftc_code: "067651"
      
    - name: "Natural Gas"
      cftc_code: "023651"
      
    - name: "Copper"
      cftc_code: "085692"
      
    - name: "USD Index"
      cftc_code: "098662"

# Flow thresholds
flow_thresholds:
  inflow_low: 100000000      # $100M
  inflow_medium: 500000000   # $500M
  inflow_high: 1000000000    # $1B
  
  outflow_low: 100000000
  outflow_medium: 500000000
  outflow_high: 1000000000
  
  # Percentage thresholds
  percentage_low: 2.0        # 2% AUM
  percentage_medium: 5.0     # 5% AUM
  percentage_high: 10.0      # 10% AUM
