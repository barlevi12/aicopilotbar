# Rating action types and their impact
rating_actions:
  upgrade:
    keywords:
      - "upgraded"
      - "raised"
      - "improved outlook"
    impact_score: 18
    
  downgrade:
    keywords:
      - "downgraded"
      - "lowered"
      - "cut rating"
    impact_score: 20
    
  outlook_positive:
    keywords:
      - "positive outlook"
      - "outlook to positive"
    impact_score: 14
    
  outlook_negative:
    keywords:
      - "negative outlook"
      - "outlook to negative"
    impact_score: 16
    
  watch_positive:
    keywords:
      - "watch positive"
      - "review for upgrade"
    impact_score: 12
    
  watch_negative:
    keywords:
      - "watch negative"
      - "review for downgrade"
    impact_score: 14
    
  affirmed:
    keywords:
      - "affirmed"
      - "confirmed"
    impact_score: 5
